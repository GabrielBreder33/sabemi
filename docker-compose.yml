services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabemi_payments}
      POSTGRES_USER: ${POSTGRES_USER:-sabemi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabemi} -d ${POSTGRES_DB:-sabemi_payments}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: src/Sabemi.Payment.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      APPLY_MIGRATIONS: ${APPLY_MIGRATIONS:-true}
      Webhook__ApiKey: ${WEBHOOK_API_KEY:-dev-webhook-key}
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sabemi_payments};Username=${POSTGRES_USER:-sabemi};Password=${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres-data:
